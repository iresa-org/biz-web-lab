<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()"
  >Skip to content</a
>
@if (showShowcaseNavigation()) {
  <header class="site-header page-width">
    <a class="brand" routerLink="/" aria-label="Iresa home">
      <span class="brand-icon" aria-hidden="true">iresa</span>
    </a>
    <nav aria-label="Main navigation">
      <a routerLink="/" fragment="showcase">The showcase</a>
      <a routerLink="/" fragment="services">What we do</a>
    </nav>
    <a class="header-cta" routerLink="/" fragment="start"
      >Let's build something <span aria-hidden="true">&#8599;</span></a
    >
  </header>
}
<main #mainContent id="main-content" tabindex="-1">
  <router-outlet #outlet="outlet" (activate)="onRouteActivate(outlet, mainContent)" />
</main>
@if (showShowcaseNavigation()) {
  <footer class="site-footer page-width">
    <a class="brand" routerLink="/" aria-label="Iresa home">
      <span class="brand-icon" aria-hidden="true">iresa</span>
    </a>
    <p>Small business, thoughtfully connected.</p>
    <span>Independent ideas. Real possibilities.</span>
  </footer>
}
